version: '3.8'

services:
  affine:
    image: node:18-alpine
    networks:
      - proxy-net
      - affine-internal
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://affine:affine@postgres:5432/affine
      - REDIS_SERVER_HOST=redis
      - REDIS_SERVER_PORT=6379
    secrets:
      - copilot_openai_key
      - copilot_anthropic_key
      - copilot_gemini_key
      - copilot_perplexity_key
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.affine-http.rule=Host(`affine-staging.joyone.vn`)"
        - "traefik.http.routers.affine-http.entrypoints=web"
        - "traefik.http.routers.affine-http.service=affine-http"
        - "traefik.http.routers.affine-https.rule=Host(`affine-staging.joyone.vn`)"
        - "traefik.http.routers.affine-https.entrypoints=websecure"
        - "traefik.http.routers.affine-https.service=affine-https"
        - "traefik.http.routers.affine-https.tls=true"
        - "traefik.http.routers.affine-https.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.affine-http.loadbalancer.server.port=3010"
        - "traefik.http.services.affine-https.loadbalancer.server.port=3010"
    command: ["sh", "-c", "echo 'AFFiNE placeholder - replace with actual build' && sleep 3600"]
    volumes:
      - affine_storage:/app/storage

  postgres:
    image: postgres:15-alpine
    networks:
      - affine-internal
    environment:
      - POSTGRES_DB=affine
      - POSTGRES_USER=affine
      - POSTGRES_PASSWORD=affine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      placement:
        constraints:
          - node.role == manager

  redis:
    image: redis:7-alpine
    networks:
      - affine-internal
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  affine_storage:
    driver: local

networks:
  proxy-net:
    external: true
  affine-internal:
    driver: overlay
    attachable: true

secrets:
  copilot_openai_key:
    external: true
  copilot_anthropic_key:
    external: true
  copilot_gemini_key:
    external: true
  copilot_perplexity_key:
    external: true
