version: '3.8'

services:
  affine:
    build: 
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: affine_app
    ports:
      - "3010:3010"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://affine:affine@postgres:5432/affine
      - REDIS_SERVER_HOST=redis
      - REDIS_SERVER_PORT=6379
      - AFFINE_CONFIG_PATH=/app/config
      # AI Provider API Keys (set these in .env file)
      - COPILOT_OPENAI_API_KEY=${COPILOT_OPENAI_API_KEY}
      - COPILOT_ANTHROPIC_API_KEY=${COPILOT_ANTHROPIC_API_KEY}
      - COPILOT_GEMINI_API_KEY=${COPILOT_GEMINI_API_KEY}
      - COPILOT_PERPLEXITY_API_KEY=${COPILOT_PERPLEXITY_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - affine_storage:/app/storage
      - affine_config:/app/config
    networks:
      - affine_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3010/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  postgres:
    image: postgres:15-alpine
    container_name: affine_postgres
    environment:
      - POSTGRES_DB=affine
      - POSTGRES_USER=affine
      - POSTGRES_PASSWORD=affine
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - affine_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U affine -d affine"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: affine_redis
    command: redis-server --appendonly yes --requirepass affine
    volumes:
      - redis_data:/data
    networks:
      - affine_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "6379:6379"

  # Optional: Nginx reverse proxy for local development
  nginx:
    image: nginx:alpine
    container_name: affine_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - affine
    networks:
      - affine_network
    restart: unless-stopped
    profiles:
      - with-proxy

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  affine_storage:
    driver: local
  affine_config:
    driver: local

networks:
  affine_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
